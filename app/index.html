<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudOps Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dashboard {
            text-align: center;
            padding: 40px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
            max-width: 600px;
            margin: 20px;
        }

        h1 {
            color: #61dafb;
        }

        .status {
            display: inline-block;
            background: #14532d;
            color: #86efac;
            padding: 10px 18px;
            border-radius: 20px;
            margin: 20px 0;
        }

        p {
            line-height: 1.7;
            color: #e2e8f0;
        }
    </style>
</head>

<body>
    <div class="dashboard">
        <h1>CloudOps Dashboard</h1>

        <div class="status">
            ● Application Running
        </div>

        <p>Welcome to my DevOps engineering project.</p>

        <p>
            This application will be containerized using Docker
            and deployed through an automated CI/CD pipeline.
        </p>

        <p>Infrastructure | Automation | Monitoring</p>
    </div>
</body>
</html>
